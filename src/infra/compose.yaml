services:
  redis:
    image: redis:alpine
    container_name: my-redis-order-q
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    env_file:
      - ../../.env.development
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: my-rabbitmq-order
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ../../.env.development
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
